<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成人 ADHD 筛查版</title>
<style>
:root{--g1:#1F4A3D;--g2:#2F5D50;--g3:#3C7A66;--g4:#6FA491;--gold:#C8A24B;--goldl:#F3EAD1;
--ink:#1B2320;--ink2:#4A5854;--line:#DDE5E1;--bg:#F5F7F5;--card:#fff;
--b0:#8FA79C;--b1:#7FA86B;--b2:#D8A93C;--b3:#D9793E;--b4:#B84A3A;
--k1:#3C7A66;--k2:#8A6BA8;--k3:#2F6D9E;--n1:#3C7A66;--n2:#8A6BA8;--n3:#2F6D9E;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
header{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#fff;padding:26px 0 22px}
.hd{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:44px;height:44px;flex:0 0 44px}
.hd h1{font-size:21px;margin:0;font-weight:600;letter-spacing:.5px}
.hd .sub{font-size:12.5px;opacity:.85;margin-top:3px}
.hd .ver{margin-left:auto;font-size:11.5px;opacity:.8;text-align:right;line-height:1.55}
/* ---- 导航 ---- */
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 18px}
.navg{flex:1 1 235px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px 10px}
.navg .gt{font-size:10.5px;color:var(--gold);letter-spacing:1.5px;font-weight:600;margin:0 0 6px 3px}
.navg button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:#fff;border:1px solid transparent;
border-radius:7px;padding:6px 8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink2);line-height:1.45;transition:.13s}
.navg button+button{margin-top:2px}
.navg button:hover{background:#F2F7F5}
.navg button.on{background:var(--g1);color:#fff}
.navg button .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D7DEDA}
.navg button.done .dot{background:var(--g3)}
.navg button.part .dot{background:var(--b2)}
.navg button.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.navg button .nm{flex:1;min-width:0}
.navg button .bd{display:block;font-size:11px;color:#9AA8A2;line-height:1.35}
.navg button.on .bd{color:#C8D8D1}
.navg button:disabled{opacity:.45;cursor:not-allowed}
.navg button:disabled:hover{background:#fff}
/* ---- 卡片 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.card>h2{font-size:17px;margin:0 0 4px;color:var(--g1);font-weight:600}
.card>h2 .tag{font-size:11px;background:var(--g1);color:#fff;padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:2px;letter-spacing:.5px}
.card>.lead{font-size:13px;color:var(--ink2);margin:0 0 16px}
h3.sec{font-size:14.5px;color:var(--g2);margin:22px 0 10px;padding-left:10px;border-left:3px solid var(--gold);font-weight:600}
h3.sec:first-of-type{margin-top:6px}
h4.sub{font-size:13px;color:var(--g2);margin:16px 0 6px;font-weight:600}
.note{background:#F4F8F6;border-left:3px solid var(--g4);padding:11px 14px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--ink2);margin:12px 0}
.note b{color:var(--g1)}
.note ul{margin:6px 0 0;padding-left:19px}.note li{margin-bottom:3px}
.warn{background:#FDF6EC;border-left-color:var(--gold)}.warn b{color:#8A6B1F}
.danger{background:#FBF0EE;border-left-color:var(--b4)}.danger b{color:var(--b4)}
/* ---- 表单 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px 16px}
.f label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;
font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
.f textarea{resize:vertical;min-height:56px;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--g3);box-shadow:0 0 0 2px rgba(60,122,102,.14)}
.readonly{background:#F3F6F4!important;color:var(--g1)!important;font-weight:600}
.agebox{background:var(--g1);color:#fff;border-radius:6px;padding:6px 10px;font-size:13.5px;font-weight:600;line-height:1.5}
.agebox.warn{background:#8A5A12;border:none}
.agebox .lb{font-size:10.5px;color:#B8D2C7;font-weight:400;display:block;letter-spacing:1px}
.agebox.warn .lb{color:#F0DDB4}
.cks{display:flex;gap:6px 18px;flex-wrap:wrap}
.cks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer}
.cks input{width:15px;height:15px;accent-color:var(--g1)}
/* ---- 按钮 ---- */
.btn{display:inline-block;background:var(--g1);color:#fff;border:1px solid var(--g1);padding:9px 20px;border-radius:7px;
cursor:pointer;font-family:inherit;font-size:13.5px;transition:.15s}
.btn:hover{background:var(--g2)}
.btn.ghost{background:#fff;color:var(--g1)}.btn.ghost:hover{background:#F0F6F3}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2E10}.btn.gold:hover{background:#B8933F}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:6px}
.btn.tiny{padding:3px 9px;font-size:11.5px;border-radius:5px}
.btn.dg{background:#fff;color:var(--b4);border-color:#E4C6BC}.btn.dg:hover{background:#FBF2EE}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btnrow .spacer{flex:1}
/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#F1F5F3;color:var(--g1);font-weight:600;font-size:12.5px}
td.c,th.c{text-align:center}
tr.hit td{background:#FCF6E7}
.pill{display:inline-block;padding:1px 9px;border-radius:11px;font-size:11.5px;color:#fff;font-weight:600}
.p0{background:var(--b0)}.p1{background:var(--b1)}.p2{background:var(--b2)}.p3{background:var(--b3)}.p4{background:var(--b4)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi div{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff}
.kpi div .k{font-size:11.5px;color:#8A968F;letter-spacing:.5px}
.kpi div .v{font-size:22px;font-weight:600;color:var(--g1);line-height:1.3}
.kpi div .g{font-size:12px;margin-top:2px;font-weight:600}
/* ---- 需求卡 ---- */
.nd{border:1px solid var(--line);border-radius:9px;padding:12px 15px;margin-bottom:10px;background:#fff;border-left:4px solid var(--k1)}
.nd.k2{border-left-color:var(--k2)}.nd.k3{border-left-color:var(--k3)}
.nd .nh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.nd .nh b{font-size:14.5px;color:var(--g1)}
.nd .nh .lv{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:5px}
.nd .nh .qn{margin-left:auto;font-size:11.5px;color:#93A29C}
.nd .dsc{font-size:12.5px;color:var(--ink2);margin-top:4px}
.lvH{background:#F7E2D6;color:#9C4A22}.lvM{background:#FBF1D8;color:#8A6B1F}.lvL{background:#EAF2E4;color:#3F6B33}
/* ---- 题目 ---- */
.modtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modtabs button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 15px;cursor:pointer;
font-family:inherit;font-size:12.5px;color:var(--ink2)}
.modtabs button.on{background:var(--g3);border-color:var(--g3);color:#fff}
.modtabs button .pc{font-size:11px;opacity:.75;margin-left:5px}
.dom{margin-bottom:18px}
.dom .dh{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600;color:var(--g1);margin-bottom:6px;flex-wrap:wrap}
.dom .dh .en{font-size:11px;color:#93A29C;font-weight:400;letter-spacing:.5px}
.dom .dh .hint{font-size:11px;color:#8A6B1F;background:var(--goldl);padding:1px 8px;border-radius:4px}
.dom .dh .axn{font-size:11px;color:#fff;background:var(--g4);padding:1px 8px;border-radius:4px;font-weight:400}
.dom .dh .axp{background:#C08A5E}
.q{display:flex;align-items:flex-start;gap:12px;padding:7px 10px;border-radius:7px;flex-wrap:wrap}
.q:nth-child(odd){background:#FAFBFA}
.q .qt{flex:1 1 290px;font-size:13.5px;line-height:1.55;padding-top:3px}
.q .qt i{font-style:normal;color:#9AA8A2;font-size:12px;margin-right:6px}
.opts{display:flex;gap:4px;flex:0 0 auto}
.opts .w{position:relative}
.opts input{position:absolute;opacity:0;width:0;height:0}
.opts .lb{display:block;min-width:46px;text-align:center;font-size:10.5px;color:var(--ink2);border:1px solid var(--line);
border-radius:6px;padding:4px 6px;cursor:pointer;background:#fff;line-height:1.35}
.opts .lb span{display:block;font-size:13px;font-weight:600;color:var(--g2)}
.opts .lb:hover{border-color:var(--g4)}
.opts .lb.crit{background:var(--goldl);border-color:#DFC98A}
.opts input:checked+.lb{background:var(--g1);border-color:var(--g1);color:#fff}
.opts input:checked+.lb span{color:var(--goldl)}
.opts input:checked+.lb.crit{background:#8A6A16;border-color:#8A6A16}
.opts input:focus-visible+.lb{outline:2px solid var(--gold);outline-offset:1px}
.legend{font-size:11.5px;color:#8A968F;margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.legend i.crit{background:var(--goldl);border-color:#DFC98A}
.prog{height:5px;background:#E7ECE9;border-radius:99px;overflow:hidden;margin:14px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--gold));transition:width .3s}
.progt{font-size:12px;color:#8A968F;text-align:right}
/* ---- COPM ---- */
.pr{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;background:#fff}
.pr.sel{border-color:var(--gold);background:#FEFCF6}
.prtop{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.prn{flex:0 0 23px;height:23px;line-height:23px;text-align:center;border-radius:50%;background:var(--g1);color:#fff;font-size:12px;font-weight:600}
.pr.sel .prn{background:var(--gold);color:#3A2E10}
.prbody{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;background:#EDF2EF;color:var(--g2);margin-right:5px}
.tag.g{background:var(--goldl);color:#8A6B1F}
.sc{display:flex;gap:3px;flex-wrap:wrap}
.sc button{width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:6px;
font-family:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);transition:.12s;padding:0}
.sc button:hover{background:var(--g3);color:#fff}
.sc button.on{background:var(--g1);color:#fff;font-weight:600;border-color:var(--g1)}
.sc.imp button.on{background:var(--gold);color:#3A2E10;border-color:var(--gold)}
.sclab{font-size:11px;color:#8A968F;display:flex;justify-content:space-between;margin-top:3px;max-width:340px}
.tp{border:1px solid var(--line);border-radius:9px;margin-bottom:13px;overflow:hidden}
.tph{background:#F1F5F3;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tph .tpn{font-weight:600;color:var(--g1);font-size:13.5px}
.tph input{width:140px;padding:5px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;font-family:inherit}
.tpb{padding:12px 14px}
.rrow{border-bottom:1px dashed var(--line);padding:10px 0}
.rrow:last-child{border-bottom:none}
.rrow .rt{font-size:13px;margin-bottom:7px}
.rpair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rpair .rl{font-size:11.5px;color:var(--g2);font-weight:600;margin-bottom:4px}
.up{color:#2E7D5B;font-weight:600}.down{color:#A8442A;font-weight:600}.flat{color:#8B9A93}
/* ---- 目标 ---- */
.goal{border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden;border-top:3px solid var(--k1)}
.goal.k2{border-top-color:var(--k2)}.goal.k3{border-top-color:var(--k3)}
.goal .gh{display:flex;align-items:baseline;gap:9px;padding:11px 15px 4px;flex-wrap:wrap}
.goal .gh .no{font-size:11px;color:#A9B5B0;letter-spacing:1px}
.goal .gh b{font-size:15px;color:var(--g1)}
.goal .gh .dm{margin-left:auto;font-size:11.5px;background:#F1F5F3;color:var(--ink2);padding:1px 8px;border-radius:4px}
.goal .gb{padding:2px 15px 13px}
.goal .sm{font-size:13px;margin-top:6px;line-height:1.6}
.goal .sm .k{color:var(--g2);font-weight:600;margin-right:6px}
.gas{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:9px}
.gas th,.gas td{border:1px solid var(--line);padding:5px 8px}
.gas th{background:#F7F9F8;width:64px;text-align:center;font-size:11.5px;color:var(--ink2)}
.gas tr.now td{background:#FDF8EC}
.gas td{line-height:1.55}
/* ---- 活动 ---- */
.act{border:1px solid var(--line);border-radius:10px;margin-bottom:11px;background:#fff;overflow:hidden;border-top:3px solid var(--k1)}
.act.c2{border-top-color:var(--k2)}.act.c3{border-top-color:var(--k3)}
.act .ah{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:11px 15px 3px}
.act .ah .no{font-size:11px;color:#A9B5B0;letter-spacing:1px;font-family:ui-monospace,Menlo,Consolas,monospace}
.act .ah b{font-size:15px;color:var(--g1)}
.act .ah .cat{font-size:11.5px;background:#F1F5F3;color:var(--ink2);padding:1px 8px;border-radius:5px}
.act .ah .ctl{margin-left:auto;display:flex;gap:5px}
.act .ab{padding:2px 15px 13px}
.act .fld{font-size:13.5px;line-height:1.6;margin-top:5px}
.act .fld .k{color:var(--g2);font-weight:600;margin-right:6px}
.act .meta{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:6px;flex-wrap:wrap}
.act .meta span{font-size:11.5px;background:#F1F5F3;color:var(--ink2);padding:2px 9px;border-radius:5px}
.act .meta span.w{background:var(--goldl);color:#8A6B1F}
.act .why{font-size:12px;color:#93A29C;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.act.locked{border-top-color:var(--gold);background:#FFFDF7}
.swap{border:1px solid var(--line);border-radius:8px;margin:6px 15px 13px;padding:10px 12px;background:#FAFBFA;display:none}
.swap.on{display:block}
.swap .opt{display:flex;align-items:flex-start;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.swap .opt:hover{background:#F0F6F3}
.swap .opt b{color:var(--g1)}
.swap .opt .mm{font-size:11.5px;color:#93A29C;margin-left:auto;flex:0 0 auto}
.chk{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.chk th,.chk td{border:1px solid var(--line);padding:5px 4px;text-align:center}
.chk th{background:#F7F9F8;font-size:11px;color:var(--ink2);font-weight:600}
.chk td.nm{text-align:left;font-size:12px}
.chk td.bx{width:30px;height:26px}
/* ---- T2报告（沿用独立版样式） ---- */
/* 导入卡 */
.src{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:11px;background:#fff;border-left:4px solid var(--line)}
.src.got{border-left-color:var(--g3);background:#FAFCFB}
.src.miss{border-left-color:var(--b2)}
.src .sh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.src .sh b{font-size:14.5px;color:var(--g1)}
.src .sh .od{font-size:11.5px;background:#F1F5F3;color:var(--ink2);padding:1px 8px;border-radius:4px}
.src .sh .stt{margin-left:auto;font-size:12px;font-weight:600}
.src .desc{font-size:12.5px;color:var(--ink2);margin-top:3px}
.src .res{font-size:13px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.src .res .kv{display:inline-block;margin-right:14px;margin-bottom:2px}
.src .res .kv b{color:var(--g2)}
/* 结果块 */
.rep{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.rep .rh{display:flex;align-items:center;gap:10px;padding:10px 15px;background:#F1F5F3;flex-wrap:wrap}
.rep .rh b{color:var(--g1);font-size:14.5px}
.rep .rh .tg{font-size:11.5px;background:var(--g4);color:#fff;padding:1px 8px;border-radius:4px}
.rep .rh .gr{margin-left:auto}
.rep .rb{padding:13px 15px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#F1F5F3;color:var(--g1);font-weight:600;font-size:12.5px}
td.c,th.c{text-align:center}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi div{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff}
.kpi div .k{font-size:11.5px;color:#8A968F;letter-spacing:.5px}
.kpi div .v{font-size:22px;font-weight:600;color:var(--g1);line-height:1.3}
.kpi div .g{font-size:12px;margin-top:2px;font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:11px;font-size:11.5px;color:#fff;font-weight:600}
.p0{background:var(--b0)}.p1{background:var(--b1)}.p2{background:var(--b2)}.p3{background:var(--b3)}.p4{background:var(--b4)}
/* 治疗需求卡 */
.need{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;border-top:4px solid var(--n1)}
.need.k2{border-top-color:var(--n2)}.need.k3{border-top-color:var(--n3)}
.need .nh{display:flex;align-items:baseline;gap:10px;padding:12px 16px 5px;flex-wrap:wrap}
.need .nh b{font-size:16px;color:var(--g1)}
.need .nh .lv{font-size:12px;font-weight:600;padding:2px 10px;border-radius:5px}
.need .nh .sc{margin-left:auto;font-size:12px;color:#93A29C}
.need .nb{padding:0 16px 14px}
.need .why{font-size:13px;margin-top:6px;line-height:1.62}
.need .why .k{color:var(--g2);font-weight:600;margin-right:6px}
.need ul{margin:6px 0 0;padding-left:19px;font-size:13px}
.need li{margin-bottom:3px}
.need .tgt{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:flex;gap:6px;flex-wrap:wrap}
.need .tgt span{font-size:11.5px;background:#F1F5F3;color:var(--ink2);padding:2px 9px;border-radius:5px}
.need .tgt span.hi{background:#F7E2D6;color:#9C4A22;font-weight:600}
.lvH{background:#F7E2D6;color:#9C4A22}.lvM{background:#FBF1D8;color:#8A6B1F}.lvL{background:#EAF2E4;color:#3F6B33}
.verdict{border:2px solid var(--g1);border-radius:10px;padding:17px 19px;background:#F4F8F6;margin:14px 0}
.verdict .lv{font-size:12px;letter-spacing:1.5px;color:var(--gold);font-weight:600}
.verdict .tt{font-size:19px;font-weight:600;color:var(--g1);margin:4px 0 9px;line-height:1.45}
.verdict ul{margin:8px 0 0;padding-left:20px;font-size:13.5px}
/* ---- 其他 ---- */
.chart{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin:12px 0;overflow-x:auto}
.chart h4{margin:0 0 8px;font-size:13.5px;color:var(--g1);font-weight:600}

/* ===== v1.5 图像与导引样式 ===== */
.pathbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 14px}
.pathbar u{flex:1 1 8px;min-width:6px;max-width:26px;height:2px;background:var(--line);margin:0 2px}
.pathbar .pn{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:16px;padding:4px 10px 4px 5px;cursor:pointer;font-family:inherit;font-size:12px;color:#7A8B83}
.pathbar .pn i{font-style:normal;width:19px;height:19px;border-radius:50%;background:#E3EAE6;color:#6B7B72;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pathbar .pn.done i{background:var(--g3);color:#fff}.pathbar .pn.done{color:var(--g2)}
.pathbar .pn.part i{background:var(--b2);color:#fff}
.pathbar .pn.flag i{background:var(--b4);color:#fff}.pathbar .pn.flag{color:#9C4A22;font-weight:600}
.pathbar .pn.opt i{background:#fff;border:1.5px dashed #A9B5B0;color:#8A968F}
.pathbar .pn.cur{background:var(--g1);color:#fff;border-color:var(--g1)}.pathbar .pn.cur i{background:#fff;color:var(--g1)}
.pathbar .pn:hover{border-color:var(--g4)}
.achip{display:inline-block;font-size:11.5px;background:#F1F5F3;color:var(--g2);padding:2px 9px;border-radius:5px;margin:2px 5px 2px 0}
.achip em{font-style:normal;color:#93A29C;margin-left:5px;font-size:10.5px}
/* 一眼看懂 */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0 6px}
.dash>div{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff;border-top:4px solid var(--g3)}
.dash .dk{font-size:11.5px;color:#8A968F;letter-spacing:.5px}
.dash .dv{font-size:20px;font-weight:700;color:var(--g1);line-height:1.35;margin:3px 0}
.dash .dn{font-size:12px;color:var(--ink2);line-height:1.55}
.dash>div.t-hi{border-top-color:var(--b4)}.dash>div.t-mid{border-top-color:var(--b2)}.dash>div.t-lo{border-top-color:var(--b1)}
.dash .ring{float:right;margin:-4px -4px 0 6px}
.bigstep{border:2px solid var(--g1);border-radius:10px;padding:14px 18px;background:#F4F8F6;margin:12px 0;display:flex;gap:14px;align-items:flex-start}
.bigstep .no{flex:0 0 38px;height:38px;border-radius:50%;background:var(--g1);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.bigstep .tx{font-size:14px;line-height:1.7}.bigstep .tx b{color:var(--g1)}
/* 这代表什么 / 下一步 */
.next{border:1px solid var(--line);border-left:4px solid var(--gold);background:#FFFDF7;border-radius:0 9px 9px 0;padding:12px 16px;margin:14px 0}
.next h4{margin:0 0 6px;font-size:13.5px;color:#8A6B1F}
.next ol,.next ul{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.75}
.next li b{color:var(--g1)}
.next.bad{border-left-color:var(--b4);background:#FFF9F7}.next.bad h4{color:var(--b4)}
.next.good{border-left-color:var(--g3);background:#F7FBF9}.next.good h4{color:var(--g2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.conf{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.conf span{font-size:12px;border-radius:5px;padding:3px 10px;background:#F1F5F3;color:var(--ink2)}
.conf span.ok{background:#EAF2E4;color:#3F6B33}.conf span.no{background:#FBF0EE;color:#9C4A22}
.tri{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.tri .bars{display:flex;gap:4px}.tri .bars i{display:block;width:34px;height:10px;border-radius:3px;background:#E3EAE6}

.tri b{font-size:15px;color:var(--g1)}
.stepcard{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:10px;background:#fff}
.stepcard .sn{grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--g3);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.stepcard.flag .sn{background:var(--b4)}.stepcard.opt .sn{background:#fff;color:#8A968F;border:1.5px dashed #A9B5B0}
.stepcard h4{margin:0;font-size:14px;color:var(--g1)}.stepcard .when{font-size:11.5px;color:#8A6B1F;background:var(--goldl);padding:0 8px;border-radius:4px;margin-left:8px;font-weight:400}
.stepcard p{margin:0;font-size:13px;color:var(--ink2);line-height:1.65}.stepcard ul{margin:2px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.rmap{margin:10px 0}
.rm-gate{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border:1.5px dashed var(--b3);border-radius:8px;padding:8px 12px;background:#FFF9F3;font-size:12.5px;margin-bottom:8px}.rm-gate b{color:#9C4A22}
.rm-row{display:flex;gap:3px}.rm-ph{color:#fff;border-radius:6px;padding:8px 10px;min-width:70px}.rm-ph b{display:block;font-size:14px}.rm-ph span{font-size:11px;opacity:.92}

.rm-rule{margin-top:8px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;font-size:12px;align-items:stretch}.rm-rule b{color:var(--g1);align-self:center}
.rm-rule span{border-radius:6px;padding:6px 10px;line-height:1.5}.rm-rule .ok{background:#EAF2E4;color:#3F6B33}.rm-rule .mid{background:#FBF1D8;color:#8A6B1F}.rm-rule .bad{background:#F7E2D6;color:#9C4A22}
@media(max-width:760px){.rm-rule{grid-template-columns:1fr}}
.chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:8px 0}
.chain>div{flex:1 1 140px;border:1px solid var(--line);background:#fff;padding:8px 11px;font-size:12.5px;line-height:1.55;position:relative;margin-right:14px;border-radius:7px}
.chain>div:after{content:"▶";position:absolute;right:-13px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--g4)}
.chain>div:last-child{margin-right:0}.chain>div:last-child:after{display:none}
.chain .ck{display:block;font-size:10.5px;color:#8A968F;letter-spacing:.5px}

.gasbar{display:flex;gap:3px;margin:8px 0}.gasbar>div{flex:1;text-align:center;font-size:11px;padding:6px 3px;border-radius:5px;color:#fff;line-height:1.4}

<header>
  <div class="hd">

<div class="wrap">
<nav class="nav" id="nav" aria-label="流程"></nav>

  <!-- ============ 个案 ============ -->
  <section class="step on" id="st_case">
    <div class="card">
      <h2>基本信息</h2>
      <p class="lead">填写姓名和年龄，然后开始。</p>
      <div class="grid f">
        <div><label for="i_name">姓名（必填）</label><input type="text" id="i_name" placeholder="请填写姓名"></div>
        <div hidden><label for="i_no">档案编号</label><input type="text" id="i_no" placeholder="例：SXK-A-2026-018"></div>
        <div><label for="i_sex">性别</label><select id="i_sex"><option value="">未填</option><option>男</option><option>女</option></select></div>
        <div><label for="i_dob">出生日期（你的生日）</label><input type="date" id="i_dob"></div>
        <div><label for="i_date">评估日期（默认今天）</label><input type="date" id="i_date"></div>
        <div><label for="i_age">已填年龄</label><div class="agebox" id="i_age"><span class="lb">AGE</span>—</div></div>
        <div><label for="i_job">职业 / 在学</label><input type="text" id="i_job" placeholder="例：互联网产品经理"></div>
        <div hidden><label for="i_rater">主责治疗师</label><input type="text" id="i_rater" placeholder="例：何明哲"></div>
        <div><label for="i_med">用药状态</label><select id="i_med"><option>未曾用药</option><option>未服药（曾用过）</option><option>服药中</option><option selected>未登记</option></select></div>
      </div>
      <div style="margin-top:12px" class="f"><label for="i_note">你最想了解或改善的事情（可不填）</label>
        <textarea id="i_note" placeholder="例如：常常来不及出门，想知道原因。"></textarea></div>
      

      <div class="btnrow">
        <button class="btn" type="button" id="btnStart">开始量表评定 →</button>
        <div class="spacer"></div>
        <button class="btn ghost sm" type="button" id="btnSave">保存个案档案</button>
        <label class="btn ghost sm" style="cursor:pointer">读取个案档案<input type="file" id="fLoad" accept=".json,application/json" style="display:none"></label>
        <button class="btn ghost sm" type="button" id="btnNew">开始新的个案</button>
      </div>
      <div id="loadMsg" style="font-size:12.5px;color:#8A968F;margin-top:8px"></div>
    </div>
  </section>

  <!-- 量表评定：第1页 -->

/* 从活动库挑「本周就能试」的小活动：优先可排程、不用器材、时间短 */
function sampleActs(sub,n){
 var L=window.ADHD_ACTIVITIES;if(!L||!sub)return [];
 var z=zh(sub),rows=L.filter(function(a){return a.subcategory===sub||zh(a.subcategory)===z;});
 var ok=rows.filter(function(a){return a.scheduleEligible!==false;});
 if(!ok.length)ok=rows;
 ok=ok.slice().sort(function(a,b){
  var ma=a.materialLevel==="none"?0:1,mb=b.materialLevel==="none"?0:1;
  if(ma!==mb)return ma-mb;
  var da=Number.isFinite(a.minutes)?a.minutes:99,db=Number.isFinite(b.minutes)?b.minutes:99;
  if(da!==db)return da-db;
  return a.id<b.id?-1:1;});
 return ok.slice(0,n||2);}
function actChips(sub,n){
 var xs=sampleActs(sub,n);
 return xs.map(function(a){
  return '<span class="achip" title="'+esc(a.id)+'">'+esc(a.title)+'<em>'+(Number.isFinite(a.minutes)?a.minutes+" 分钟":"")+'</em></span>';}).join("");}

/* 每周三项名额预估（与后续专业评估的分配规则一致：执行功能 ×1.2、每个方向最多 2 项、执行功能达边缘以上至少 1 项） */
function previewSlots(needs){
 var pool=needs.filter(function(n){return n.score!=null;}).map(function(n){return{key:n.key,score:n.score,need:n.score*(n.key==="ef"?1.2:1)};});

 pool.forEach(function(n){n.exact=n.need/tot*3;n.base=Math.min(2,Math.floor(n.exact));n.rem=n.exact-Math.floor(n.exact);n.slots=n.base;});

  };

  }
  function restore(recordId) {
    var record;
    try { if(!idOK(recordId)) throw Error('请选择一笔记录'); record=getRecord(recordId); if(!record) throw Error('找不到这笔记录'); }
    catch(e) { return fail(e,'这笔本机记录无法读取，当前填写内容保持原状。'); }
    if(pending && !flush()) return false;
    try {
      applyRecord(record);
      var pointer=JSON.stringify({id:id}); storage().setItem(ACTIVE,pointer);
      if(storage().getItem(ACTIVE)!==pointer) throw Error('索引未保存');
      notice='已恢复上次填写内容，可以接着完成。'; paint(); history(); return true;
    } catch(e) { return fail(e,'本机记录未能完整恢复。'); }
  }
  APP.changed=function() { var r=baseChanged.apply(this,arguments); schedule(); return r; };
  go=function() { var before=typeof CUR==='string'?CUR:'case', r=baseGo.apply(this,arguments); if(!pause && started && before!==CUR) { pending=true; flush(); } return r; };
  resetCase=function() {
    if(pause || !started) return baseReset.apply(this,arguments);
    if((pending || id) && !flush()) return false;
    pause=true; try { baseReset.apply(this,arguments); id=null; revision=0; savedAt=''; fingerprint=''; notice='已开始新的填写；之前的资料仍保留在本机记录中。'; pending=true; }
    finally { pause=false; }
    return flush();
  };
  loadCase=function(raw) {
    if(pause || !started) return baseLoad.apply(this,arguments);
    try { validateCaseImport(typeof raw==='string'?JSON.parse(raw):raw); } catch(e) { return {err:'档案未读取：'+e.message+'。目前个案保持原状。'}; }
    if((pending || id) && !flush()) return {err:'当前填写内容尚未保存，请先导出备份后再读取档案。'};
    var result; pause=true;
    try { result=baseLoad.apply(this,arguments); if(result && result.ok) { id=null; revision=0; fingerprint=''; savedAt=''; notice='已读取档案；原有本机记录仍保留。'; pending=true; } }
    finally { pause=false; }
    if(result && result.ok) flush(); return result;
  };
  function addUI() {
    var banner=document.createElement('div'); banner.className='autosave-banner noprint'; banner.id='autosave-banner';
    banner.innerHTML='<span class="autosave-dot" aria-hidden="true"></span><div><span id="autosave-status" role="status" aria-live="polite"></span><p id="autosave-detail"></p></div>';
    var nav=document.getElementById('nav'); if(nav) nav.before(banner); else document.body.prepend(banner);
    var body=document.querySelector('#data-tools .data-tools-body') || document.getElementById('data-tools');
    if(body) {
      var box=document.createElement('div'); box.className='autosave-history';
      box.innerHTML='<label for="autosave-history">本机已保存的填写记录</label><div class="autosave-history-row"><select id="autosave-history"></select><button type="button" class="btn ghost sm" id="autosave-restore">继续这笔记录</button></div><p id="autosave-history-note"></p>';
      body.prepend(box);
      document.getElementById('autosave-restore').onclick=function(){restore(document.getElementById('autosave-history').value);};
    }
    var newButton=document.getElementById('btnNew');
    if(newButton) { var replacement=newButton.cloneNode(true); replacement.textContent='开始新的填写（保留旧记录）'; newButton.replaceWith(replacement); replacement.onclick=function(){resetCase();}; }
    ['btnSave','btnSave2'].forEach(function(k){var b=document.getElementById(k);if(b)b.textContent='导出备份（可选）';});
  }
  init=function() {
    pause=true; baseInit.apply(this,arguments); started=true; addUI();
    try {
      var rows=scan(), activeRaw=storage().getItem(ACTIVE), candidate=null, invalidPointer=false;
      if(activeRaw!=null) { try { var ptr=JSON.parse(activeRaw); if(!ptr || !idOK(ptr.id)) throw Error('bad pointer'); candidate=rows.find(function(r){return r.id===ptr.id;}) || null; if(!candidate) invalidPointer=true; } catch(_) { invalidPointer=true; } }
      if(!candidate && rows.length) candidate=rows[0];
      if(candidate) { applyRecord(candidate); notice=invalidPointer || corruptCount ? '已恢复最近可读取的记录；无法读取的原始资料仍保留。' : '已恢复上次填写内容，可以接着完成。'; }
      else { state='idle'; if(invalidPointer || corruptCount) notice='发现无法读取的本机记录，原始资料已保留。可继续新填写或导入备份。'; }
    } catch(e) { fail(e); }
    finally { pause=false; pending=false; FLOW_DIRTY=false; paint(); history(); }
    document.addEventListener('input',function(e){if(e.target.closest && e.target.closest('.step') && e.target.id!=='autosave-history' && e.target.id!=='fLoad') schedule();});
    document.addEventListener('change',function(e){if(e.target.closest && e.target.closest('.step') && e.target.id!=='autosave-history' && e.target.id!=='fLoad') {schedule();flush();}});
  };
  // Registered before the base init installs its unload handler: persist the last keystroke first.
  window.addEventListener('beforeunload',function(e){ if(!started) return; var ok=flush(); if(!ok && pending) { e.preventDefault(); e.returnValue=''; } });
  window.addEventListener('pagehide',function(){flush();});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden') flush();});
  window.addEventListener('storage',function(e){
    if(!started || !e.key || e.key.indexOf(NS)!==0) return;
    if(id && e.key===keyOf(id)) { notice='另一页面更新了这份记录；此页内容保留，继续填写会另存为新版本。'; paint(); }
    history();
  });
  window.AUTO_SAVE={flush:flush,restore:restore,newCase:function(){return resetCase();},records:function(){return scan().map(function(r){return clone(r);});},status:function(){return {state:state,id:id,rev:revision,savedAt:savedAt,error:error,pending:pending,namespace:NS};}};
})();

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>





<script>
(function(){
 function setQR(f){if(!f||!/^image\//.test(f.type))return;var r=new FileReader();r.onload=function(){window.SR_QR=String(r.result);paint();};r.readAsDataURL(f);}
 function paint(){var b=document.getElementById('sr-qr');if(!b)return;var tmp=document.createElement('div');tmp.innerHTML=window.__qrHtml?window.__qrHtml():'';}
 function repaint(){var box=document.getElementById('sr-qr');if(!box)return;var img=window.SR_QR&&/^data:image\//.test(window.SR_QR);
  box.querySelector('.sr-qr-box').innerHTML=img?'<img alt="二维码">':'<span>二维码<br>贴放处</span>';
  if(img)box.querySelector('.sr-qr-box img').src=window.SR_QR;
  var side=box.querySelector('.sr-qr-side'),c=side.querySelector('.sr-qr-clear');
  if(img&&!c){c=document.createElement('button');c.type='button';c.className='sr-qr-clear noprint';c.setAttribute('data-sr-qr-clear','');c.textContent='清除';side.appendChild(c);}
  if(!img&&c)c.remove();}
 paint=repaint;
 document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('[data-sr-qr-clear]')){window.SR_QR='';repaint();return;}
  if(e.target.closest&&e.target.closest('[data-sr-qr-pick]')){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){setQR(i.files&&i.files[0]);};i.click();}});
 document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-sr-qr-pick]')){e.preventDefault();e.target.click();}});
 document.addEventListener('paste',function(e){var s=document.getElementById('st_s2');if(!s||!s.classList.contains('on'))return;var it=Array.from((e.clipboardData||{}).items||[]).filter(function(x){return x.type.indexOf('image/')===0;})[0];if(it){e.preventDefault();setQR(it.getAsFile());}});
})();
</script>
