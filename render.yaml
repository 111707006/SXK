services:
  - type: web
    name: sxk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_REPORT_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
