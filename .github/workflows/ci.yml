name: CI

# 正式站跑的是部署分支（2026-11 起是 client-changes-1022），不是 master：兩條都要跑，
# 不然線上的程式碼從來沒過過 CI（2026-11-10 稽核）。
on:
  push:
    branches: [master, client-changes-1022]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20：正式站主機的版本（v20.20.2）；22：之後要升的版本
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (lint)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
