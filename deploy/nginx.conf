# ============================================
# 森心康 Nginx 配置
#
#   sxkscreen.com / www  → 专案 A（APP_MODE=full）   127.0.0.1:5000
#   t1.sxkscreen.com     → 专案 B（APP_MODE=t1only） 127.0.0.1:5001
#
# ⚠️⚠️ 现有服务器上专案 A **已经在服务**（/etc/nginx/sites-enabled/sxk）。
# **不要用这个文件整份覆盖它。** A 那一半在这里是为了记录现况与将来重装；
# 要加上 B 的话，只取下面「专案 B」那一段，存成独立文件：
#
#     sudo nano /etc/nginx/sites-available/sxk-b
#     sudo ln -s /etc/nginx/sites-available/sxk-b /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# 分成两个文件，A 的配置就永远不会因为改 B 而被碰到 —— 一次 reload 弄挂正在
# 服务的主域名，代价远大于「配置分散在两个文件」这点不便。
#
# 【为什么是纯代理，没有 root / try_files】
# Node 自己用 express.static 服务前端（server.ts 的 `app.use(express.static(distPath))`），
# SPA 兜底也在那里。nginx 再写一份 root + try_files 不是错，但会变成两个地方
# 决定「静态文件从哪来」，而它们会在某次部署后悄悄分岔。
# ============================================


# ============================================
# 专案 A —— sxkscreen.com（现况记录，服务器上已有，勿覆盖）
# ============================================
server {
    listen 443 ssl http2;
    server_name sxkscreen.com www.sxkscreen.com;

    ssl_certificate     /etc/nginx/ssl/www.sxkscreen.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.sxkscreen.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 报告二维码里的绝对网址靠这个头判断 http/https（server.ts 的 requestOrigin）。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /assets {
        proxy_pass http://127.0.0.1:5000/assets;
        proxy_set_header Host $host;
        proxy_set_header Cache-Control 'public, max-age=31536000, immutable';
    }
}

server {
    listen 80;
    server_name sxkscreen.com www.sxkscreen.com;
    return 301 https://$host$request_uri;
}


# ============================================
# 专案 B —— t1.sxkscreen.com
#
# ⚠️ 需要**另一张证书**：现有那张只涵盖 sxkscreen.com 与 www.sxkscreen.com
#    （阿里云免费 DV，2026-10-14 到期），t1 不在里面，所以 t1 的 TLS 现在是断的。
#    去阿里云 SSL 证书控制台单独为 t1.sxkscreen.com 申请一张免费证书，
#    下载 Nginx 格式，放到 /etc/nginx/ssl/ 下，文件名对上下面两行。
#
#    证书没就位就启用这一段的话，`nginx -t` 会因为找不到证书文件而失败 ——
#    那是好事，它挡住了一次会让 443 起不来的 reload。
#
# 【合作公司不需要各自的子域名】
# 归属走进站连结的 ?c=<slug>（src/utils/attribution.ts），
# 例如 https://t1.sxkscreen.com/?c=abc-clinic。companies.slug 是 UNIQUE，
# 冲突由数据库挡住。新增一家公司是在后台建一笔资料，不用碰这个文件。
# ============================================
server {
    listen 443 ssl http2;
    server_name t1.sxkscreen.com;

    ssl_certificate     /etc/nginx/ssl/t1.sxkscreen.com.pem;
    ssl_certificate_key /etc/nginx/ssl/t1.sxkscreen.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /assets {
        proxy_pass http://127.0.0.1:5001/assets;
        proxy_set_header Host $host;
        proxy_set_header Cache-Control 'public, max-age=31536000, immutable';
    }
}

server {
    listen 80;
    server_name t1.sxkscreen.com;
    return 301 https://$host$request_uri;
}

