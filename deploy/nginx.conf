# ============================================
# 森心康 Nginx 配置（两个产品，两个 server block）
# 放置路径: /etc/nginx/sites-available/sxk
# 启用命令: ln -s /etc/nginx/sites-available/sxk /etc/nginx/sites-enabled/
#
#   sxkscreen.com      → 专案 A（APP_MODE=full）  /var/www/sxk-a/dist  :5000
#   t1.sxkscreen.com   → 专案 B（APP_MODE=t1only）/var/www/sxk-b/dist  :5001
#
# ⚠️ 把下面所有的 sxkscreen.com 换成你的真实域名。
#
# 【合作公司不需要各自的子域名】
# 归属走的是进站连结上的 `?c=<slug>`（见 src/utils/attribution.ts），
# 例如 https://t1.sxkscreen.com/?c=abc-clinic。`companies.slug` 是 UNIQUE，
# 冲突由数据库挡住。新增一家公司是在后台建一笔资料，不用碰这个文件 ——
# 「每签一家就改一次 nginx」是会一直付下去的成本。
#
# 【两个 server block 有重复的部分】
# 安全头、gzip、静态缓存三段两边一样。改其中一边时**两边一起改** ——
# 抽成 snippet 可以去掉重复，但代价是部署多一个文件，忘了传就整个 nginx 起不来。
# ============================================

# ── 兜底：Host 对不上任何一个站点时直接断开 ──
#
# 没有这一段的话，nginx 会把**第一个** server block 当成默认站点：用 IP 直接
# 访问、或者 t1 打错字，都会落到专案 A 上。A 带着付费墙与深度评估端点，而 B 是
# 交给合作公司的那一套 —— 认错方向的那一边是 A。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ============================================
# 专案 A —— sxkscreen.com
# ============================================
server {
    listen 80;
    server_name sxkscreen.com www.sxkscreen.com;

    root /var/www/sxk-a/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 报告二维码里的绝对网址由这个头决定（见 .env.example 的 PUBLIC_BASE_URL）。
        # 少了它，上了 HTTPS 之后二维码里仍然是 http://。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # AI 报告生成可能较慢。
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================
# 专案 B —— t1.sxkscreen.com（合作公司都在这个域名底下，用 ?c= 区分）
# ============================================
server {
    listen 80;
    server_name t1.sxkscreen.com;

    root /var/www/sxk-b/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================
# HTTPS（备案通过、证书下来之后启用）
#
# 步骤：
#   1. 证书放到 /etc/nginx/ssl/（阿里云免费证书选 Nginx 格式，或用 certbot）
#   2. 把上面两个 server block 的 `listen 80;` 改成 `listen 443 ssl http2;`
#      并加上下面的 ssl_* 四行
#   3. 启用最下面那个 80 → 443 的跳转 block
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 一张证书要同时涵盖 sxkscreen.com、www、t1 三个名字（多域名证书），
#    或者申请 *.sxkscreen.com 的通配符证书。只签主域名的话 t1 会跳证书错误。
# ============================================
#
#     ssl_certificate     /etc/nginx/ssl/sxkscreen.com.pem;
#     ssl_certificate_key /etc/nginx/ssl/sxkscreen.com.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
# server {
#     listen 80;
#     server_name sxkscreen.com www.sxkscreen.com t1.sxkscreen.com;
#     return 301 https://$host$request_uri;
# }
