name: CI

# 正式站跑的是部署分支（2026-11 起是 client-changes-1022），不是 master：兩條都要跑，
# 不然線上的程式碼從來沒過過 CI（2026-11-10 稽核）。
on:
  push:
    branches: [master, client-changes-1022]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要 Node 22.13 以上，CI 沒辦法用正式站的 Node 20 安裝（2026-11-10 試過）
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (lint)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
